<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threads 搜尋</title>
  <link rel="icon" href="data:,">
<!-- 純前端：Supabase JS SDK (UMD) 由 CDN 載入，無需任何 server -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #0f0f12; --fg: #e7e9ea; --muted: #8899a6;
    --card: #1a1c20; --border: #2f3336; --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--fg); min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h1 span { color: var(--accent); }
  .searchbar {
    display: flex; gap: 8px; position: sticky; top: 0;
    background: var(--bg); padding: 12px 0;
  }
  .searchbar input {
    flex: 1; padding: 12px 16px; font-size: 16px;
    background: var(--card); color: var(--fg);
    border: 1px solid var(--border); border-radius: 999px; outline: none;
  }
  .searchbar input:focus { border-color: var(--accent); }
  .searchbar button {
    padding: 12px 22px; font-size: 16px; border: none; border-radius: 999px;
    background: var(--accent); color: #fff; cursor: pointer; font-weight: 600;
  }
  .searchbar button:disabled { opacity: .5; cursor: default; }
  .meta { color: var(--muted); font-size: 13px; margin: 8px 0 16px; min-height: 18px; }
  .post {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
  }
  .post .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .post .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: #333;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 16px; flex-shrink: 0;
  }
  .post .name { font-weight: 700; font-size: 15px; }
  .post .handle { color: var(--muted); font-size: 13px; }
  .post .time { margin-left: auto; color: var(--muted); font-size: 12px; }
  .post .text { white-space: pre-wrap; word-break: break-word; line-height: 1.5; font-size: 15px; }
  .post .stats { display: flex; gap: 16px; margin-top: 10px; color: var(--muted); font-size: 13px; }
  .post a { color: var(--accent); text-decoration: none; font-size: 13px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .err { text-align: center; color: #f4a; padding: 20px; }
  mark { background: #5b8def55; color: var(--fg); border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Threads <span>關鍵字搜尋</span></h1>

  <div class="searchbar">
    <input id="kw" type="text" placeholder="輸入關鍵字，例如「AI 繪圖」…" autocomplete="off">
    <button id="go">搜尋</button>
  </div>

  <div class="meta" id="meta"></div>
  <div id="results"></div>
</div>

<script>
// ===== 設定（你的 Supabase 專案憑證）=====
const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const kwEl = document.getElementById("kw");
const goEl = document.getElementById("go");
const metaEl = document.getElementById("meta");
const resultsEl = document.getElementById("results");

function escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function fmtTime(unix) {
  if (!unix) return "";
  const d = new Date(unix * 1000);
  return d.toLocaleString("zh-Hant", { dateStyle: "medium", timeStyle: "short" });
}

function fmtCount(n) {
  if (n == null) return "0";
  if (n >= 10000) return (n / 10000).toFixed(1) + "萬";
  if (n >= 1000) return (n / 1000).toFixed(1) + "k";
  return String(n);
}

async function search() {
  const kw = kwEl.value.trim();
  if (!kw) return;

  goEl.disabled = true;
  metaEl.textContent = "搜尋中…";
  resultsEl.innerHTML = "";

  const pattern = "%" + kw + "%";
  const { data, error } = await client
    .from("posts")
    .select("*")
    .or(`text.ilike.${pattern},username.ilike.${pattern},full_name.ilike.${pattern}`)
    .order("taken_at", { ascending: false })
    .limit(200);

  goEl.disabled = false;

  if (error) {
    metaEl.textContent = "";
    resultsEl.innerHTML = `<div class="err">查詢失敗：${error.message}</div>`;
    return;
  }

  metaEl.textContent = `找到 ${data.length} 筆結果`;
  if (!data.length) {
    resultsEl.innerHTML = `<div class="empty">沒有符合「${kw}」的貼文。</div>`;
    return;
  }

  resultsEl.innerHTML = data.map((p) => {
    const initial = (p.username || "?").charAt(0).toUpperCase();
    return `
      <div class="post">
        <div class="head">
          <div class="avatar">${initial}</div>
          <div>
            <div class="name">${escapeHtml(p.full_name || "")}</div>
            <div class="handle">@${escapeHtml(p.username || "")}</div>
          </div>
          <div class="time">${fmtTime(p.taken_at)}</div>
        </div>
        <div class="text">${highlight(escapeHtml(p.text || ""), kw)}</div>
        <div class="stats">
          <span>❤ ${fmtCount(p.like_count)}</span>
          <span>💬 ${fmtCount(p.reply_count)}</span>
          <span>🔁 ${fmtCount(p.repost_count)}</span>
          <a href="${p.url || "#"}" target="_blank" rel="noopener">開啟原貼文 ↗</a>
        </div>
      </div>`;
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function highlight(text, kw) {
  const esc = escapeReg(kw);
  return text.replace(new RegExp("(" + esc + ")", "gi"), "<mark>$1</mark>");
}

goEl.addEventListener("click", search);
kwEl.addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
</script>
</body>
</html>
